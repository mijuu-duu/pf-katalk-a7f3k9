<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* 손님이 글씨를 길게 눌러도 드래그·선택·복사·검색 메뉴가 뜨지 않게 한다.
     (관리자 입력칸과 진단 결과는 예외로 선택 가능) */
  #phone { -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  #phone input, #phone textarea, #phone select, #phone #diagOut, #phone .kv {
    -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text; }
  #phone img { -webkit-user-drag:none; user-drag:none; -webkit-touch-callout:none; }
  html,body { height:100%; overscroll-behavior:none; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    background:#333;
    display:flex; justify-content:center; align-items:center;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* 폰 프레임 */
  #phone {
    --safe-b: 0px;
    width:100%; max-width:430px; height:100vh; height:100dvh; max-height:930px;
    background:#b2c7d9; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }

  /* 헤더 */
  .header {
    height:52px; flex-shrink:0; display:flex; align-items:center;
    padding:0 8px; position:relative;
  }
  .header .back { width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    font-size:24px; color:#3a3a3a; cursor:pointer; border:none; background:none; }
  .header .title { flex:1; font-size:18px; font-weight:700; color:#1a1a1a; padding-left:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .header .actions { display:flex; gap:4px; }
  .header .actions button { width:40px; height:40px; border:none; background:none; cursor:pointer;
    font-size:20px; color:#3a3a3a; }

  /* 리스트 화면 배경은 흰색 */
  .screen { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #listScreen { background:#fff; display:flex; flex-direction:column; overflow:hidden; }
  #listScreen .header { background:#fff; flex-shrink:0; }
  #chatList { flex:1; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

  /* 하단 탭바 (장식용) */
  .tabbar { flex-shrink:0; background:#fff; border-top:1px solid #eef0f2;
    display:flex; align-items:stretch; padding-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--safe-b)); }
  .tab { flex:1; display:flex; align-items:center; justify-content:center; color:#bcc2c8;
    min-height:56px; }
  .tab.active { color:#191919; }
  .tab svg { width:27px; height:27px; display:block; }
  .tab-ico { position:relative; display:flex; }
  .tab-badge { position:absolute; top:-5px; left:15px; background:#ff3b30; color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:999px; padding:0 5px;
    font-family:Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
    display:inline-flex; align-items:center; justify-content:center; line-height:1; box-sizing:border-box; }
  .tab-badge.hidden { display:none; }

  /* 채팅방 목록 */
  .chat-item { display:flex; align-items:center; padding:11px 16px; cursor:pointer; }
  .chat-item:active { background:#f0f0f0; }
  .avatar { width:50px; height:50px; border-radius:18px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
    font-size:18px; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }

  /* 단톡방 프로필: 둥근 사각형을 사람 수에 맞춰 분할 (카카오톡 방식) */
  .avatar.grp { display:grid; gap:1.5px; background:#fff; }
  .avatar.grp.n1 { grid-template-columns:1fr; }
  .avatar.grp.n2 { grid-template-columns:1fr 1fr; }
  .avatar.grp.n3, .avatar.grp.n4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .avatar.grp.n3 .cell:first-child { grid-row:span 2; }
  .avatar.grp .cell { overflow:hidden; background:#dfe3e8; min-width:0; min-height:0; }
  .avatar.grp .cell img, .avatar.grp .cell svg { width:100%; height:100%; object-fit:cover; display:block; }

  .chat-meta { flex:1; min-width:0; margin-left:12px; }
  .chat-name-row { display:flex; align-items:baseline; }
  .chat-name { font-size:16px; font-weight:600; color:#1a1a1a;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-count { font-size:13px; color:#8a8a8a; margin-left:5px; flex-shrink:0; }
  .chat-preview { font-size:13.5px; color:#8a8a8a; margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-right { text-align:right; margin-left:8px; flex-shrink:0; display:flex; flex-direction:column;
    align-items:flex-end; gap:5px; }
  .chat-time { font-size:11.5px; color:#b0b0b0; }
  /* 안읽음 뱃지 — 기기(한글 기본 글꼴)마다 숫자가 위아래로 치우치지 않도록
     숫자 전용 글꼴 + line-height:1 + flex 중앙 정렬로 고정한다 */
  .badge { background:#ff3b30; color:#fff; font-size:11px; font-weight:700;
    font-family:Roboto, "Helvetica Neue", Arial, sans-serif; line-height:1;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
    min-width:19px; height:19px; border-radius:999px; padding:0 6px; box-sizing:border-box;
    display:inline-flex; align-items:center; justify-content:center; text-align:center;
    flex-shrink:0; }

  /* 채팅방 화면 */

  #roomScreen.active { display:flex; }

  /* 스크롤바는 숨기고 터치·휠 스크롤은 그대로 (카톡처럼) */

  .float-date.show { opacity:1; }

  .date-divider { text-align:center; margin:14px 0; }
  .date-divider span { background:rgba(0,0,0,.12); color:#fff; font-size:12px;
    padding:4px 12px; border-radius:12px; }

  /* 초대 안내 같은 시스템 문구 (카카오톡 방식: 배경 없는 가운데 회색 글씨) */
  .sys-notice { text-align:center; margin:2px 22px 14px; font-size:11.5px; line-height:1.5;

  .msg-row { display:flex; margin-bottom:10px; align-items:flex-start; }
  .msg-row.mine { flex-direction:row-reverse; }
  .msg-avatar { width:40px; height:40px; border-radius:14px; flex-shrink:0; overflow:hidden;

  .msg-avatar img { width:100%; height:100%; object-fit:cover; }
  .msg-avatar.spacer { background:transparent !important; }
  .msg-body { max-width:68%; margin:0 8px; }
  .msg-sender { font-size:12.5px; color:#3a3a3a; margin-bottom:4px; margin-left:2px; }
  .msg-line { display:flex; align-items:flex-end; }
  .msg-row.mine .msg-line { flex-direction:row-reverse; }
  .bubble { padding:8px 11px; border-radius:14px; font-size:14.5px; line-height:1.4;

  .msg-row:not(.mine) .bubble { background:#fff; border-top-left-radius:3px; color:#1a1a1a; }
  .msg-row.mine .bubble { background:#fef01b; border-top-right-radius:3px; color:#1a1a1a; }
  .msg-info { display:flex; flex-direction:column; font-size:10.5px; margin:0 5px;

  .msg-row.mine .msg-info { align-items:flex-end; }
  .msg-unread { color:#fee500; font-weight:700; }
  .msg-row:not(.mine) .msg-unread { color:#4a7ab5; }
  .msg-time { color:#5a6b7a; white-space:nowrap; }

  /* 사진 메시지 (카카오톡 UI: 말풍선 없이 둥근 사진) */
  .msg-stack { display:flex; flex-direction:column; gap:4px; align-items:flex-start; min-width:0; }
  .msg-row.mine .msg-stack { align-items:flex-end; }
  .msg-photo { border-radius:14px; overflow:hidden; background:#dfe3e8; line-height:0; cursor:pointer;

  /* 사진 크게 보기 */
  #photoViewer { display:none; position:absolute; inset:0; z-index:200; background:#000;

  #photoViewer.show { display:flex; }
  #photoViewer img { max-width:100%; max-height:100%; object-fit:contain; }
  #photoViewer .pv-close { position:absolute; top:14px; right:14px; width:38px; height:38px;

  /* 하단 입력바 (장식용, 손님 모드에서 비활성) */

function wipeStored(){
  try{
    localStorage.removeItem(STORE_KEY);
    LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  try{
    if(window.caches && caches.keys){
      caches.keys().then(keys=>keys.forEach(k=>{ if(k.indexOf(DATA_VERSION)===-1) caches.delete(k); }));
    }
  }catch(e){}
}

/* 파일에 들어있는 대화 내용의 지문.
   DATA_VERSION 을 고치지 않고 내용만 바꿔도 “새 파일”로 인식하게 해준다. */
function fingerprint(o){
  let s;
  try{ s = JSON.stringify(o); }catch(e){ return 'x'; }
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){
    h = (h ^ s.charCodeAt(i)) >>> 0;
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(36) + '-' + s.length.toString(36);
}
const DATA_FP = fingerprint(EMBEDDED_DATA);

function storedBox(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ return null; }
}

/* 파일에서 막 읽어온 상태의 지문. 이후 내용이 달라지면 “이 기기에만 저장된 수정”이다 */
let baseFp = null;

function load(){
  const box = storedBox();
  if(box && box.data && box.version === DATA_VERSION && box.fp === DATA_FP){
    baseFp = box.base || null;
    return normalize(box.data);
  }
  wipeStored();
  const fresh = normalize(deepCopy(EMBEDDED_DATA));
  baseFp = fingerprint(fresh);
  return fresh;
}
function hasLocalEdits(){
  return !!baseFp && fingerprint(data) !== baseFp;
}

function save(){
  if(!storageOK) return true;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      version: DATA_VERSION, fp: DATA_FP, base: baseFp, savedAt: new Date().toISOString(), data: data
    }));
    return true;
  }catch(e){
    toast('저장 공간이 부족합니다. 사진을 줄이거나 내보내기로 백업하세요.');

}

/* ---------- 새 파일 자동 감지 (재설치·파일 교체 반영) ----------
   설치된 앱은 캐시로도 열리기 때문에, 실행할 때마다 서버에 놓인 index.html 을
   한 번 확인해서 내용이 다르면 캐시·저장분을 지우고 새 파일로 다시 연다. */
const MARK_S = '/*__CS' + '_DATA_START__';
const MARK_E = '/*__CS' + '_DATA_END__*/';

function readFileData(txt){
  const i = txt.indexOf(MARK_S), j = txt.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  try{
    const block = txt.slice(i, j).replace(MARK_S, '/*');
    return (new Function(block + '\nreturn { v: DATA_VERSION, d: EMBEDDED_DATA };'))();
  }catch(e){ return null; }
}

function forceUpdate(){
  const go = ()=> location.replace(listUrl(curList().key));
  const steps = [];
  try{ localStorage.removeItem(STORE_KEY); LEGACY_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{
    if(window.caches && caches.keys){
      steps.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))));
    }
  }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      steps.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))));
    }
  }catch(e){}
  Promise.all(steps).then(go, go);
}

function checkForUpdate(manual){
  if(location.protocol.indexOf('http') !== 0){
    if(manual) toast('로컬 서버(localhost)로 열었을 때만 확인할 수 있습니다');
    return;
  }
  fetch('./index.html?_uc=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(txt=>{
      const got = readFileData(txt);
      if(!got){ if(manual) toast('파일을 확인할 수 없습니다'); return; }
      const fileFp = fingerprint(got.d);
      const same = (got.v === DATA_VERSION) && (fileFp === DATA_FP);
      const info = document.getElementById('updInfo');
      if(info){
        const rooms = (got.d.lists||[]).reduce((a,x)=>a+(x.rooms||[]).length,0);
        const msgs = (got.d.lists||[]).reduce((a,x)=>a+(x.rooms||[]).reduce((b,r)=>b+(r.messages||[]).length,0),0);
        info.innerHTML = '서버 파일 버전 <b>' + esc(got.v) + '</b> · 지문 <b>' + esc(fileFp) + '</b><br>'
          + '서버 파일 내용 <b>대화방 ' + rooms + '개 · 메시지 ' + msgs + '개</b><br>'
          + '판정 <b>' + (same ? '지금 보이는 내용과 같음' : '다름 → 새 내용으로 교체') + '</b>';
      }
      if(same){ if(manual) toast('이미 최신 파일입니다'); return; }
      const tag = got.v + '|' + fingerprint(got.d);
      let tried = null;
      try{ tried = sessionStorage.getItem('cs_upd'); }catch(e){}
      if(!manual && tried === tag){
        toast('새 파일이 있는데 적용되지 않았습니다. 관리자 모드에서 “새 파일 확인”을 눌러주세요.');
        return;
      }
      try{ sessionStorage.setItem('cs_upd', tag); }catch(e){}
      toast('새 파일을 발견했습니다. 새 내용으로 다시 엽니다…');
      setTimeout(forceUpdate, 700);
    })
    .catch(()=>{ if(manual) toast('서버에 연결할 수 없습니다. 서버 앱이 켜져 있는지 확인하세요.'); });
}

/* 옛 형식(rooms 가 최상위)도 그대로 받아들여 새 형식으로 올려준다 */
function normalize(d){
  if(!d) d = {};
  if(!Array.isArray(d.lists)){
    const one = {
      key: '기본',
      title: d.listTitle || '채팅',
      chipText: d.chipText || 'ChatGPT',
      bottomPad: Number(d.bottomPad)||0,
      ad: d.ad || {},
      rooms: Array.isArray(d.rooms) ? d.rooms : []
    };
    d = { appName: d.appName || '채팅', lists: [one] };
  }
  if(!d.appName) d.appName = '채팅';
  if(!d.lists.length) d.lists = [{ key:'기본', title:'채팅', chipText:'ChatGPT', bottomPad:0, ad:{}, rooms:[] }];

  const usedKeys = [];
  d.lists.forEach((L, i)=>{
    L.title = L.title || '채팅';
    if(L.label === undefined) L.label = '';     /* 소분류 표시 이름 (비면 주소용 이름 사용) */
    L.chipText = L.chipText || 'ChatGPT';
    L.bottomPad = Math.max(0, Number(L.bottomPad)||0);
    L.ad = Object.assign({ show:true, top:'', head:'', foot:'광고입니다.', img:'', logo:'' }, L.ad||{});
    if(!Array.isArray(L.rooms)) L.rooms = [];
    let k = String(L.key || L.title || ('목록'+(i+1))).trim() || ('목록'+(i+1));
    while(usedKeys.indexOf(normKey(k)) !== -1) k = k + '_2';
    usedKeys.push(normKey(k));
    L.key = k;

    L.rooms.forEach(room=>{
      if(!room.id) room.id = id();
      if(!Array.isArray(room.participants)) room.participants = [];
      if(!Array.isArray(room.messages)) room.messages = [];
      if(room.listUnread === undefined) room.listUnread = null;
      let c = 0;
      room.participants.forEach(p=>{
        if(!p.id) p.id = id();
        if(p.silo === undefined || p.silo === null) p.silo = c % 2;
        if(p.avatar === undefined) p.avatar = '';
        c++;
      });
      room.messages.forEach(m=>{
        if(!m.id) m.id = id();
        if(m.text === undefined) m.text = '';
        if(m.image === undefined) m.image = '';
        if(m.time === undefined) m.time = '';
        if(m.date === undefined) m.date = '';
        m.unread = Number(m.unread)||0;
      });
    });
  });
  const keep = data;
  data = d;                 /* ensureTree 안에서 쓰는 도우미들이 data 를 참조한다 */
  try{ ensureTree(d); } catch(e){}
  data = keep;
  return d;
}

function id(){ return 'x'+Math.random().toString(36).slice(2,9); }

/* ---------- 대화 목록(세트) ---------- */
function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,'_'); }
function curList(){ return data.lists[listIdx] || data.lists[0]; }

/* ---------- 분류(폴더) 트리 — 관리자 정리용, 손님 화면에는 영향 없음 ----------
   data.tree = [ { id, name(대분류), children:[ { id, name(중분류), lists:[목록 주소이름…] } ] } ] */
function sanitizeKey(s){
  return String(s||'').trim().replace(/\s+/g,'_').replace(/[?&#%\/\\]/g,'');
}
function makeListKey(c1name, c2name, label, self){
  const base = [c1name, c2name, label].map(sanitizeKey).filter(Boolean).join('_') || '목록';
  let k = base, n = 2;
  while(data.lists.some(L=>L!==self && normKey(L.key)===normKey(k))){ k = base + '_' + n; n++; }
  return k;
}
function listByKey(key){
  const n = normKey(key);
  return data.lists.find(L=>normKey(L.key)===n) || null;
}
function listsOfCat(c2){
  return (c2.lists||[]).map(k=>listByKey(k)).filter(Boolean);
}
function catOfList(key){
  const n = normKey(key);
  for(const c1 of data.tree){
    for(const c2 of c1.children){
      if((c2.lists||[]).some(k=>normKey(k)===n)) return { c1:c1, c2:c2 };
    }
  }
  return null;
}
function treeRemoveList(key){
  const n = normKey(key);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = (c2.lists||[]).filter(k=>normKey(k)!==n);
  }));
}
function treeRenameListKey(oldKey, newKey){
  const n = normKey(oldKey);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = (c2.lists||[]).map(k=> normKey(k)===n ? newKey : k);
  }));
}
function countInCat1(c1){
  let lists = 0;
  (c1.children||[]).forEach(c2=> lists += (c2.lists||[]).length);
  return { subs:(c1.children||[]).length, lists:lists };
}
/* 트리 정리 + 옛 데이터 올려주기 */
function ensureTree(d){
  if(!Array.isArray(d.tree)) d.tree = [];
  d.tree = d.tree.filter(c1=>c1 && typeof c1 === 'object');
  d.tree.forEach(c1=>{
    if(!c1.id) c1.id = id();
    c1.name = String(c1.name || '분류');
    if(!Array.isArray(c1.children)) c1.children = [];
    c1.children.forEach(c2=>{
      if(!c2.id) c2.id = id();
      c2.name = String(c2.name || '분류');
      if(!Array.isArray(c2.lists)) c2.lists = [];
    });
  });
  /* 트리에 들어있지 않은 목록 찾기 */
  const inTree = {};
  d.tree.forEach(c1=>c1.children.forEach(c2=>c2.lists.forEach(k=>{ inTree[normKey(k)] = true; })));
  const orphans = d.lists.filter(L=>!inTree[normKey(L.key)]);
  if(!orphans.length){
    /* 없어진 목록을 가리키는 항목 정리 */
    d.tree.forEach(c1=>c1.children.forEach(c2=>{
      c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k)));
    }));
    return;
  }
  let target;
  if(!d.tree.length){
    /* 처음 분류를 도입할 때: 기존 목록을 “강남1호점 > 폐가” 아래로 넣는다 */
    const c2 = { id:id(), name:'폐가', lists:[] };
    d.tree.push({ id:id(), name:'강남1호점', children:[c2] });
    target = { c1:d.tree[0], c2:c2 };
  } else {
    let c1 = d.tree.find(c=>c.name === '미분류');
    if(!c1){ c1 = { id:id(), name:'미분류', children:[] }; d.tree.push(c1); }
    let c2 = c1.children[0];
    if(!c2){ c2 = { id:id(), name:'미분류', lists:[] }; c1.children.push(c2); }
    target = { c1:c1, c2:c2 };
  }
  orphans.forEach(L=>{
    if(L.label === undefined || L.label === ''){
      const p = normKey(target.c2.name) + '_';
      L.label = (normKey(L.key).indexOf(p) === 0) ? L.key.slice(target.c2.name.length + 1) : L.key;
    }
    const newKey = makeListKey(target.c1.name, target.c2.name, L.label, L);
    if(normKey(newKey) !== normKey(L.key)) L.key = newKey;
    target.c2.lists.push(L.key);
  });
  d.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k)));
  }));
}

function requestedListKey(){

/* ---------- 날짜 / 시간 입력 변환 ---------- */
/* 20260504 → 2026-05-04, 2026.5.4 / 26-5-4 / 0504 도 인식 */
function parseDateInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  const nums = s.match(/\d+/g);
  if(!nums) return null;
  const digits = nums.join('');
  let y, mo, da;
  if(nums.length >= 3){ y = +nums[0]; mo = +nums[1]; da = +nums[2]; }
  else if(digits.length === 8){ y = +digits.slice(0,4); mo = +digits.slice(4,6); da = +digits.slice(6,8); }
  else if(digits.length === 6){ y = 2000 + (+digits.slice(0,2)); mo = +digits.slice(2,4); da = +digits.slice(4,6); }
  else if(nums.length === 2){ y = new Date().getFullYear(); mo = +nums[0]; da = +nums[1]; }
  else if(digits.length === 4){ y = new Date().getFullYear(); mo = +digits.slice(0,2); da = +digits.slice(2,4); }
  else return null;
  if(y < 100) y += 2000;
  if(!(mo>=1 && mo<=12) || !(da>=1 && da<=31)) return null;
  const d = new Date(y, mo-1, da);
  if(d.getFullYear()!==y || d.getMonth()!==mo-1 || d.getDate()!==da) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
}
/* 1450 → 오후 2:50, 930 → 오전 9:30, "오후 2:50" 은 그대로 */
function parseTimeInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  let ampm = '';
  if(/오전|AM|am|Am/.test(s)) ampm = '오전';
  if(/오후|PM|pm|Pm/.test(s)) ampm = '오후';
  const nums = s.replace(/[^\d]/g,'');
  if(!nums) return null;
  let h, mi;
  if(nums.length <= 2){ h = +nums; mi = 0; }
  else if(nums.length === 3){ h = +nums.slice(0,1); mi = +nums.slice(1); }
  else if(nums.length === 4){ h = +nums.slice(0,2); mi = +nums.slice(2); }
  else return null;
  if(mi > 59) return null;
  if(ampm){
    if(h < 1 || h > 12) return null;
  } else {
    if(h > 23) return null;
    ampm = h < 12 ? '오전' : '오후';
    h = (h % 12) || 12;
  }
  return `${ampm} ${h}:${String(mi).padStart(2,'0')}`;
}
function formatKoreanDate(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length!==3) return iso;
  const y=+parts[0], mo=+parts[1], da=+parts[2];
  const dObj = new Date(y, mo-1, da);
  if(isNaN(dObj)) return iso;
  const wd = ['일','월','화','수','목','금','토'][dObj.getDay()];
  return `${y}년 ${mo}월 ${da}일 ${wd}요일`;
}

/* ---------- 안 읽음 개수 ---------- */
/* 카카오톡과 같은 규칙:
   내가 마지막으로 보낸 시점 이후에 상대방이 보낸 메시지 개수.
   1:1·단톡방 모두 동일하며, 마지막 메시지를 내가 보냈으면 0이 된다.
   내가 한 번도 보낸 적이 없으면 상대방 메시지 전체 개수. */
function autoUnread(room){
  const msgs = room.messages || [];
  const mine = m => { const p = partOf(room, m.senderName); return !!(p && p.isMe); };
  let lastMine = -1;
  for(let i = msgs.length-1; i >= 0; i--){ if(mine(msgs[i])){ lastMine = i; break; } }
  let n = 0;
  for(let i = lastMine+1; i < msgs.length; i++){ if(!mine(msgs[i])) n++; }
  return n;
}
/* ---------- 목록 정렬 / 시간 표시 ---------- */
/* "오후 9:12" → 하루 중 분 단위 값 */
function timeToMinutes(s){
  const str = String(s||'');
  const m = str.match(/(\d{1,2}):(\d{2})/);
  if(!m) return 0;
  let h = +m[1];
  const mi = +m[2];
  if(/오후|PM|pm/.test(str) && h < 12) h += 12;
  if(/오전|AM|am/.test(str) && h === 12) h = 0;
  return h*60 + mi;
}
/* 방의 마지막 메시지가 언제인지 (날짜는 바뀌는 날 첫 메시지에만 있으므로 누적해서 찾는다) */
function lastMsgWhen(room){
  const msgs = room.messages || [];
  if(!msgs.length) return null;
  let date = '';
  for(let i = 0; i < msgs.length; i++){ if(msgs[i].date) date = msgs[i].date; }
  const last = msgs[msgs.length-1];
  return { date: date, time: last.time || '', minutes: timeToMinutes(last.time) };
}
/* “오늘”로 볼 기준 날짜. 목록마다 지정할 수 있고, 비어 있으면 실제 오늘. */
function refToday(){
  const s = String((curList().today || '')).trim();
  if(s){
    const p = s.split('-');
    const y = +p[0], m = +p[1], d = +p[2];
    if(y && m && d){
      const dt = new Date(y, m-1, d);
      if(!isNaN(dt)) return { y:y, m:m, d:d, date:dt, fixed:true };
    }
  }
  const n = new Date();
  return { y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate(),
           date:new Date(n.getFullYear(), n.getMonth(), n.getDate()), fixed:false };
}
/* 정렬용 숫자 (날짜가 없으면 기준 날짜로 본다) */
function roomSortValue(room){
  const w = lastMsgWhen(room);
  if(!w) return -1;
  let y, m, d;
  if(w.date){ const p = w.date.split('-'); y = +p[0]; m = +p[1]; d = +p[2]; }
  if(!(y && m && d)){ const t = refToday(); y = t.y; m = t.m; d = t.d; }
  return (y*10000 + m*100 + d) * 2000 + w.minutes;
}
/* 목록 오른쪽 표시: 오늘이면 시간, 어제면 “어제”, 그보다 전이면 “9월 8일” */
function listTimeLabel(room){
  const w = lastMsgWhen(room);
  if(!w) return '';
  if(!w.date) return w.time;
  const p = w.date.split('-');
  const y = +p[0], m = +p[1], d = +p[2];
  if(!(y && m && d)) return w.time;
  const ref = refToday();
  const target = new Date(y, m-1, d);
  const diff = Math.round((ref.date - target) / 86400000);
  if(diff === 0) return w.time;
  if(diff === 1) return '어제';
  if(y !== ref.y) return `${y}. ${m}. ${d}.`;   /* 기준 날짜와 해가 다르면 연도까지 */
  return `${m}월 ${d}일`;
}
/* 고정된 방이 위, 그다음은 최신 메시지 순(자동 정렬을 끄면 저장된 순서) */
function orderedRooms(L){
  const auto = L.autoSort !== false;
  return L.rooms.map((r,i)=>({r:r, i:i})).sort((a,b)=>{
    const pa = a.r.pinned?1:0, pb = b.r.pinned?1:0;
    if(pa !== pb) return pb - pa;
    if(auto){
      const sa = roomSortValue(a.r), sb = roomSortValue(b.r);
      if(sa !== sb) return sb - sa;
    }
    return a.i - b.i;
  }).map(x=>x.r);
}

function roomUnread(room){
  if(typeof room.listUnread === 'number' && room.listUnread >= 0) return room.listUnread;
  return autoUnread(room);
}

/* ---------- 단톡방 초대 문구 ---------- */
/* 초대한 사람 = 참여자 목록 맨 위 사람, 초대된 사람 = 나머지 전원 */
function inviteAuto(room){
  const ps = room.participants || [];
  if(ps.length < 2) return '';
  const inviter = (ps[0].name || '').trim();
  const rest = ps.slice(1).map(p=>(p.name||'').trim()).filter(Boolean);
  if(!inviter || !rest.length) return '';
  return `${inviter}님이 ${rest.map(n=>n+'님').join(', ')}을 초대했습니다.`;
}
function inviteShown(room){ return !!room.isGroup && room.inviteShow !== false; }
function inviteTextOf(room){
  const own = (room.inviteText || '').trim();
  return own || inviteAuto(room);
}
function inviteEl(room){
  const el = document.createElement('div');
  el.className = 'sys-notice';
  el.textContent = inviteTextOf(room);
  return el;
}

function renderMessages(room){
  const box = $('#messages'); box.innerHTML = '';
  const msgs = room.messages;
  const showInvite = inviteShown(room) && !!inviteTextOf(room);
  if(!msgs.length){
    if(showInvite) box.appendChild(inviteEl(room));
    return;
  }

  /* 각 메시지가 속한 날짜를 먼저 계산 (날짜는 바뀌는 날 첫 메시지에만 입력) */
  const eff = [];
  let cd = null;
  msgs.forEach(m=>{ if(m.date && m.date !== cd) cd = m.date; eff.push(cd); });

  /* 발신자 + 시간이 같으면 한 묶음. 묶음이 바뀌면 프로필/이름을 다시 보여준다 */
  const gkey = i => (msgs[i].senderName||'') + '|' + (msgs[i].time||'');
  const sameGroup = (a,b) => a>=0 && b<msgs.length && eff[a]===eff[b] && gkey(a)===gkey(b);

  let shownDate = null;
  msgs.forEach((msg, i)=>{
    if(eff[i] && eff[i] !== shownDate){
      const dv = document.createElement('div');
      dv.className = 'date-divider';
      dv.innerHTML = `<span>${esc(formatKoreanDate(eff[i]))}</span>`;
      box.appendChild(dv);
      shownDate = eff[i];
    }
    /* 순서: 날짜 → 초대 문구 → 첫 메시지 */
    if(i === 0 && showInvite) box.appendChild(inviteEl(room));
    const p = partOf(room, msg.senderName) || {name:msg.senderName, isMe:false, avatar:'', silo:0};
    const mine = !!p.isMe;
    const isGroupHead = !sameGroup(i-1, i);
    const isGroupTail = !sameGroup(i, i+1);

    const row = document.createElement('div');
    row.className = 'msg-row' + (mine?' mine':'');
    row.dataset.date = eff[i] || '';

    let avatarHtml = '';
    if(!mine){
      avatarHtml = isGroupHead
        ? (p.avatar ? `<div class="msg-avatar"><img src="${p.avatar}"></div>`
                    : `<div class="msg-avatar">${silhouette(p.silo)}</div>`)
        : `<div class="msg-avatar spacer"></div>`;
    }
    const unread = Number(msg.unread)||0;
    const infoHtml = `<div class="msg-info">
        ${unread>0?`<span class="msg-unread">${unread}</span>`:''}
        ${isGroupTail?`<span class="msg-time">${esc(msg.time||'')}</span>`:''}
      </div>`;
    const photoHtml = msg.image
      ? `<div class="msg-photo" data-photo="${esc(msg.id)}"><img src="${msg.image}" alt="사진"></div>` : '';
    const textHtml = msg.text ? `<div class="bubble">${esc(msg.text)}</div>` : '';

    row.innerHTML = `
      ${avatarHtml}
      <div class="msg-body">
        ${(!mine && isGroupHead)?`<div class="msg-sender">${esc(p.name)}</div>`:''}
        <div class="msg-line">
          <div class="msg-stack">${photoHtml}${textHtml}</div>
          ${infoHtml}
        </div>
      </div>`;
    const ph = row.querySelector('[data-photo]');
    if(ph) ph.onclick = ()=> openPhoto(msg.image);
    box.appendChild(row);
  });
}

/* 설치가 안 될 때 원인을 한 화면에 모아 보여준다 */
function runDiag(){
  const out = [];
  const ua = navigator.userAgent || '';
  const cm = ua.match(/Chrome\/(\d+)/);
  const cv = cm ? Number(cm[1]) : 0;
  const inApp = /; wv\)|\bwv\b|KAKAOTALK|FBAN|FB_IAB|Instagram|NAVER|Line\//i.test(ua);
  out.push('코드 버전: ' + CODE_VERSION + ' / 파일 버전: ' + DATA_VERSION);
  out.push('브라우저: ' + (cm ? ('Chrome ' + cm[1]) : '크롬 아님 또는 확인 불가'));
  out.push('버전 판정: ' + (cv === 0 ? '확인 불가' : (cv >= 76 ? '앱 설치 지원 버전' : '너무 오래된 버전 — 크롬 업데이트 필요')));
  out.push('내장 브라우저: ' + (inApp ? '예 — 크롬 앱에서 직접 열어야 설치됩니다' : '아니오'));
  out.push('https(보안) 상태: ' + (window.isSecureContext ? '정상' : '아님 — 설치 불가'));
  out.push('서비스워커 지원: ' + (('serviceWorker' in navigator) ? '지원' : '지원 안 함'));
  out.push('서비스워커 상태: ' + swState);
  out.push('설치 신호(beforeinstallprompt): ' + (deferredInstall ? '받음' : '아직 없음'));
  out.push('매니페스트 주소: ' + (document.getElementById('manifestLink').getAttribute('href') || '(없음)'));
  const box = document.getElementById('diagOut');
  box.style.display = 'block';
  box.textContent = out.join('\n') + '\n서버 응답 확인 중…';
  const jobs = [];
  jobs.push(fetch('./sw.js?diag=' + Date.now(), {cache:'no-store'})
    .then(r=> 'sw.js 응답: ' + r.status + ' / ' + (r.headers.get('content-type')||'?'))
    .catch(e=> 'sw.js 응답: 실패 (' + e + ')'));
  const mfHref = document.getElementById('manifestLink').getAttribute('href') || './manifest.webmanifest';
  jobs.push(fetch(mfHref, {cache:'no-store'})
    .then(r=> r.json().then(j=> '매니페스트 응답: ' + r.status + ' / 이름 ' + j.name, ()=> '매니페스트 응답: ' + r.status + ' / 내용 읽기 실패'))
    .catch(()=> '매니페스트 응답: 실패'));
  jobs.push((('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
    .then(rs=> '등록된 서비스워커: ' + rs.length + '개')
    .catch(()=> '등록 목록 확인 실패'));
  Promise.all(jobs).then(extra=>{ box.textContent = out.concat(extra).join('\n'); });
}

/* ----- 끌어서 순서 바꾸기 (마우스·터치 공용) ----- */
function makeSortable(box, onDone){
  if(!box) return;
  box.classList.add('sortable');
  let el = null, armed = false, dragging = false, startY = 0, timer = null;
  const items = ()=> [].slice.call(box.querySelectorAll('[data-sort]'));
  const stop = ()=>{
    clearTimeout(timer);
    if(el) el.classList.remove('dragging');
    const did = dragging;
    el = null; armed = false; dragging = false;
    if(did) onDone(items().map(x=>x.dataset.sort));
  };
  box.addEventListener('pointerdown', e=>{
    const t = e.target.closest('[data-sort]');
    if(!t || e.target.closest('button, input, textarea, select, .node-name')) return;
    el = t; startY = e.clientY; armed = false; dragging = false;
    if(e.pointerType === 'mouse'){ armed = true; }
    else { timer = setTimeout(()=>{ armed = true; el.classList.add('dragging'); }, 280); }
  });
  box.addEventListener('pointermove', e=>{
    if(!el) return;
    if(!armed){
      if(Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); el = null; }
      return;
    }
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 4) return;
      dragging = true;
      el.classList.add('dragging');
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    const y = e.clientY;
    items().forEach(s=>{
      if(s === el) return;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        const mid = r.top + r.height/2;
        if(y < mid) box.insertBefore(el, s);
        else box.insertBefore(el, s.nextSibling);
      }
    });
  });
  box.addEventListener('pointerup', stop);
  box.addEventListener('pointercancel', stop);
  box.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});
}

/* ----- 분류 화면의 버튼 연결 ----- */
function uniqueName(existing, base){
  let n = base, i = 2;
  while(existing.indexOf(n) !== -1){ n = base + ' ' + i; i++; }
  return n;
}
function keysUnderC1(c1){
  const out = [];
  (c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>out.push(k)));
  return out;
}
function deleteListByKey(key){
  const L = listByKey(key);
  if(!L) return;
  const cur = data.lists[listIdx];
  const i = data.lists.indexOf(L);
  data.lists.splice(i, 1);
  treeRemoveList(key);
  const ni = data.lists.indexOf(cur);
  listIdx = (ni >= 0) ? ni : Math.max(0, Math.min(i, data.lists.length - 1));
}
function reorderListsByTree(){
  const cur = data.lists[listIdx];
  const seen = {}, out = [];
  data.tree.forEach(c1=>(c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>{
    const L = listByKey(k);
    if(L && !seen[normKey(L.key)]){ seen[normKey(L.key)] = 1; out.push(L); }
  })));
  data.lists.forEach(L=>{ if(!seen[normKey(L.key)]) out.push(L); });
  data.lists = out;
  const i = data.lists.indexOf(cur);
  listIdx = (i >= 0) ? i : 0;
}

function bindTreeSection(body){
  body.querySelectorAll('[data-fold]').forEach(h=>{
    h.onclick = ()=>{ const k = h.dataset.fold; foldState[k] = !foldState[k]; renderAdminHome(); };
  });
  const up = $('#treeUp');
  if(up) up.onclick = ()=>{ treePath.pop(); editingNode = ''; renderAdminHome(); };
  body.querySelectorAll('[data-enter]').forEach(b=> b.onclick = ()=>{
    treePath.push(b.dataset.enter); editingNode = ''; renderAdminHome();
  });
  body.querySelectorAll('[data-rename]').forEach(el=>{
    el.ondblclick = ()=>{ editingNode = el.dataset.rename; renderAdminHome(); };
  });

  const nSave = $('#nodeSave');
  if(nSave){
    $('#nodeCancel').onclick = ()=>{ editingNode = ''; renderAdminHome(); };
    const nName = $('#nodeName'), nKey = $('#nodeKey');
    const makeKeyNow = ()=>{
      const c1 = curC1(), c2 = curC2();
      const label = nName.value.trim() || '목록';
      return makeListKey(c1?c1.name:'', c2?c2.name:'', label, listByKey(editingNode.slice(2)));
    };
    /* 관리자 화면용 이름을 적으면 주소용 이름이 자동으로 따라 채워진다.
       주소 칸을 직접 고치면 그때부터 자동 채움을 멈춘다. */
    if(nKey){
      let keyTouched = false;
      nKey.oninput = ()=>{ keyTouched = true; };
      nName.oninput = ()=>{ if(!keyTouched) nKey.value = makeKeyNow(); };
    }
    const auto = $('#nodeAuto');
    if(auto) auto.onclick = ()=>{ if(nKey){ nKey.value = makeKeyNow(); nKey.oninput = ()=>{}; } };
    nSave.onclick = ()=>{
      const nameVal = $('#nodeName').value.trim();
      if(!nameVal){ toast('이름을 입력하세요'); return; }
      if(nKey && !nKey.value.trim()) nKey.value = makeKeyNow();   /* 비어 있으면 자동 생성 */
      if(editingNode.indexOf('c1:') === 0){
        const node = data.tree.find(c=>c.id === editingNode.slice(3));
        if(node) node.name = nameVal;
      } else if(editingNode.indexOf('c2:') === 0){
        const c1 = curC1();
        const node = c1 && (c1.children||[]).find(c=>c.id === editingNode.slice(3));
        if(node) node.name = nameVal;
      } else {
        const oldKey = editingNode.slice(2);
        const L = listByKey(oldKey);
        if(L){
          L.label = nameVal;
          const newKey = sanitizeKey($('#nodeKey').value);
          if(newKey && normKey(newKey) !== normKey(oldKey)){
            if(data.lists.some(x=>x !== L && normKey(x.key) === normKey(newKey))){
              toast('같은 주소용 이름이 이미 있습니다'); return;
            }
            L.key = newKey;
            treeRenameListKey(oldKey, newKey);
            try{
              if(savedListKey() && normKey(savedListKey()) === normKey(oldKey)) localStorage.setItem(LAST_KEY, newKey);
            }catch(e){}
          }
        }
      }
      editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('저장되었습니다');
    };
  }

  const add = $('#treeAdd');
  if(add) add.onclick = ()=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree.push({ id:id(), name:uniqueName(data.tree.map(x=>x.name), '새 대분류'), children:[] });
    } else if(!c2){
      c1.children.push({ id:id(), name:uniqueName(c1.children.map(x=>x.name), '새 중분류'), lists:[] });
    } else {
      const label = uniqueName(data.lists.map(listLabel), '새 목록');
      const key = makeListKey(c1.name, c2.name, label, null);
      data.lists.push({ key:key, label:label, title:'채팅', chipText:'ChatGPT', bottomPad:0,
        ad:{ show:false, top:'', head:'', foot:'광고입니다.', img:'', logo:'' }, rooms:[] });
      c2.lists.push(key);
      listIdx = data.lists.length - 1;
    }
    save(); renderAdminHome();
  };

  body.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.cdel;
    const isC1 = (v.indexOf('c1:') === 0);
    let node, keys, removeIt;
    if(isC1){
      const i = data.tree.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = data.tree[i]; keys = keysUnderC1(node);
      removeIt = ()=> data.tree.splice(i, 1);
    } else {
      const c1 = curC1(); if(!c1) return;
      const i = (c1.children||[]).findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = c1.children[i]; keys = (node.lists||[]).slice();
      removeIt = ()=> c1.children.splice(i, 1);
    }
    if(keys.length && keys.length >= data.lists.length){
      toast('목록은 최소 1개 필요합니다. 다른 분류에 목록을 남겨두세요.');
      return;
    }
    const doIt = ()=>{
      keys.forEach(k=>deleteListByKey(k));
      removeIt();
      save(); renderAdminHome(); toast('삭제되었습니다');
    };
    if(keys.length) confirmDialog('“' + node.name + '” 안에 목록 ' + keys.length + '개가 있습니다.\n안의 목록까지 함께 삭제할까요?', doIt, '모두 삭제');
    else confirmDialog('“' + node.name + '” 분류를 삭제할까요?', doIt);
  });

  body.querySelectorAll('[data-lopen]').forEach(b=> b.onclick = ()=>{
    const i = data.lists.indexOf(listByKey(b.dataset.lopen));
    if(i >= 0){ listIdx = i; save(); renderAdminHome(true); }
  });
  body.querySelectorAll('[data-lcopy]').forEach(b=> b.onclick = ()=>{
    const src = listByKey(b.dataset.lcopy);
    if(!src) return;
    const c = catOfList(src.key);
    const copy = deepCopy(src);
    copy.label = uniqueName(data.lists.map(listLabel), listLabel(src) + ' 사본');
    copy.key = makeListKey(c?c.c1.name:'', c?c.c2.name:'', copy.label, null);
    copy.rooms.forEach(r=>{ r.id = id(); r.participants.forEach(p=>p.id = id()); r.messages.forEach(m=>m.id = id()); });
    const at = data.lists.indexOf(src) + 1;
    data.lists.splice(at, 0, copy);
    if(c){
      const pos = c.c2.lists.findIndex(k=>normKey(k) === normKey(src.key));
      c.c2.lists.splice(pos + 1, 0, copy.key);
    }
    listIdx = at;
    save(); renderAdminHome(); toast('복제되었습니다');
  });
  body.querySelectorAll('[data-ldel]').forEach(b=> b.onclick = ()=>{
    const L = listByKey(b.dataset.ldel);
    if(!L) return;
    if(data.lists.length <= 1){ toast('목록은 최소 1개 필요합니다'); return; }
    confirmDialog('“' + listLabel(L) + '” 목록을 통째로 삭제할까요?', ()=>{
      deleteListByKey(L.key); save(); renderAdminHome(); toast('삭제되었습니다');
    });
  });

  makeSortable($('#treeBox'), order=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree = order.map(v=>data.tree.find(c=>c.id === v)).filter(Boolean);
    } else if(!c2){
      c1.children = order.map(v=>(c1.children||[]).find(c=>c.id === v)).filter(Boolean);
    } else {
      c2.lists = order.slice();
      reorderListsByTree();
    }
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
}

/* ----- 다른 대화 목록의 대화방 불러오기 (분류를 따라 폴더처럼 이동) ----- */
let impPath = [];   /* [] | [대분류id] | [대분류id, 중분류id] | [대분류id, 중분류id, 목록key] */
function importRoomPanel(){
  const c1 = impPath[0] ? data.tree.find(c=>c.id === impPath[0]) : null;
  const c2 = (c1 && impPath[1]) ? (c1.children||[]).find(c=>c.id === impPath[1]) : null;
  const L  = (c2 && impPath[2]) ? listByKey(impPath[2]) : null;
  let rows = '';

  if(!c1){
    if(!data.tree.length) rows = '<div class="hint" style="margin:0">분류가 없습니다.</div>';
    data.tree.forEach(node=>{
      const cnt = countInCat1(node);
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">중분류 ${cnt.subs}개 · 목록 ${cnt.lists}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!c2){
    if(!(c1.children||[]).length) rows = '<div class="hint" style="margin:0">중분류가 없습니다.</div>';
    (c1.children||[]).forEach(node=>{
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">목록 ${(node.lists||[]).length}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!L){
    const items = listsOfCat(c2).filter(x=>x !== curList());
    if(!items.length) rows = '<div class="hint" style="margin:0">불러올 목록이 없습니다.</div>';
    items.forEach(x=>{
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(listLabel(x))}</div>
              <div class="rsub">대화방 ${x.rooms.length}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${esc(x.key)}">열기</button>
          </div>
        </div>`;
    });
  } else {
    if(!L.rooms.length) rows = '<div class="hint" style="margin:0">이 목록에는 대화방이 없습니다.</div>';
    L.rooms.forEach((r, ri)=>{
      const last = r.messages[r.messages.length-1];
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0">
              <div class="rname">${esc(r.name)}${r.isGroup?' <span class="rsub" style="display:inline">· 단톡방</span>':''}</div>
              <div class="rsub">참여자 ${r.participants.length}명 · 메시지 ${r.messages.length}개</div>
              <div class="rsub">${esc(previewText(last) || '(내용 없음)')}</div>
            </div>
            <button class="btn btn-primary btn-sm" data-imp="${esc(L.key)}:${ri}">불러오기</button>
          </div>
        </div>`;
    });
  }

  const crumb = [c1 && c1.name, c2 && c2.name, L && listLabel(L)].filter(Boolean).join(' › ') || '전체 분류';
  return `
    <div style="background:#f7f9fb;border:1px solid #e3e7ec;border-radius:10px;padding:10px;margin-bottom:10px">
      <div class="hint" style="margin:0 0 8px">다른 대화 목록의 대화방을 <b>참여자·대화 내용 그대로</b> 이 목록(<b>${esc(listLabel(curList()))}</b>)으로 복사합니다. 원본은 그대로 남습니다.</div>
      <div class="crumb">
        ${impPath.length ? '<button class="btn btn-ghost btn-sm" id="impUp">↑ 상위 폴더</button>' : ''}
        <span class="crumb-txt">${esc(crumb)}</span>
      </div>
      ${rows}
      <button class="btn btn-ghost btn-sm btn-block" id="importRoomClose">닫기</button>
    </div>`;
}

function moveList(i, dir){
  const j = i + dir;
  if(j < 0 || j >= data.lists.length) return;
  const cur = data.lists[listIdx];
  [data.lists[i], data.lists[j]] = [data.lists[j], data.lists[i]];
  listIdx = data.lists.indexOf(cur);
  save(); renderAdminHome();
}
function addRoom(){
  const room = { id:id(), name:'새 대화방', isGroup:false, listUnread:null,
    participants:[{id:id(), name:'나', silo:0, isMe:true, avatar:''},
                  {id:id(), name:'상대방', silo:0, isMe:false, avatar:''}],
    messages:[] };
  curList().rooms.push(room); save(); editRoom(room.id);
}
function delRoom(rid){
  const room = findRoom(rid);
  confirmDialog(`“${room?room.name:''}” 대화방을 삭제할까요?`, ()=>{
    const L = curList();
    L.rooms = L.rooms.filter(r=>r.id!==rid); save(); renderAdminHome(); toast('삭제되었습니다');
  });
}
function moveRoom(rid, dir){
  const L = curList();
  const i = L.rooms.findIndex(r=>r.id===rid);
  const j = i+dir;
  if(j<0||j>=L.rooms.length) return;
  [L.rooms[i], L.rooms[j]] = [L.rooms[j], L.rooms[i]];
  save(); renderAdminHome();
}

/* 비율 유지하며 가로 최대 maxW로 축소 */
function resizeImageFit(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
/* 정사각형으로 잘라 축소 (프로필용) */
function resizeImage(file, size, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2, sy = (img.height - side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

  hint.className = 'hint';
  hint.style.margin = '0 0 10px';
  hint.innerHTML = '시간은 <b>1450</b> → 오후 2:50, <b>930</b> → 오전 9:30 처럼 숫자만 넣으면 됩니다.<br>날짜는 <b>20260504</b> → 2026-05-04 로 바뀌며, <b>바뀌는 날의 첫 메시지</b>에만 넣으면 됩니다.';
  box.appendChild(hint);
  room.messages.forEach((msg, i)=>{
    const ed = document.createElement('div');
    ed.className = 'msg-editor';
    const unread = Number(msg.unread)||0;
    ed.innerHTML = `
      <div class="er1">
        <select data-f="sender">
          ${opts.map(n=>`<option ${n===msg.senderName?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
        <input data-f="time" placeholder="1450" value="${esc(msg.time||'')}">
      </div>
      <div class="er1">
        <input data-f="date" style="flex:1;width:auto" placeholder="20260504 (날짜가 바뀔 때만)" value="${esc(msg.date||'')}">
        <button class="btn btn-ghost btn-sm" data-a="dateClear" title="날짜 표시 지우기" ${msg.date?'':'disabled'}>날짜 지움</button>
      </div>
      <div class="stamp" data-f="stamp">${msg.date?esc(formatKoreanDate(msg.date)):''}</div>
      <div class="er2" style="margin-top:8px">
        <textarea data-f="text" placeholder="메시지 내용">${esc(msg.text||'')}</textarea>
      </div>
      <div class="er4">
        ${msg.image?`<div class="er-pv"><img src="${msg.image}"></div>`:''}
        <button class="btn btn-ghost btn-sm" data-a="photo">${msg.image?'사진 변경':'＋ 사진'}</button>
        ${msg.image?'<button class="btn btn-ghost btn-sm" data-a="photoDel">사진 제거</button>':''}
        <input type="file" accept="image/*" style="display:none" data-a="file">
      </div>
      <div class="er3">
        <label><input type="checkbox" data-f="unreadOn" ${unread>0?'checked':''}> 안읽음 숫자</label>
        <input data-f="unread" type="number" min="0" style="width:64px;padding:5px 8px" value="${unread}" ${unread>0?'':'disabled'}>
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" data-up="${i}" ${i===0?'disabled':''}>▲</button>
        <button class="btn btn-ghost btn-sm" data-down="${i}" ${i===room.messages.length-1?'disabled':''}>▼</button>
        <button class="btn btn-danger btn-sm" data-del="${i}">삭제</button>
      </div>`;

    ed.querySelector('[data-f="sender"]').onchange = e=>{ msg.senderName = e.target.value; save(); };

    const timeInput = ed.querySelector('[data-f="time"]');
    const applyTime = ()=>{
      const parsed = parseTimeInput(timeInput.value);
      if(parsed === null){ toast('시간을 알아볼 수 없습니다. 예: 1450, 930, 오후 2:50'); timeInput.value = msg.time||''; return; }
      msg.time = parsed; timeInput.value = parsed; save();
    };
    timeInput.onchange = applyTime;
    timeInput.onblur = applyTime;

    const dateInput = ed.querySelector('[data-f="date"]');
    const stamp = ed.querySelector('[data-f="stamp"]');
    const applyDate = ()=>{
      const parsed = parseDateInput(dateInput.value);
      if(parsed === null){ toast('날짜를 알아볼 수 없습니다. 예: 20260504, 2026-05-04'); dateInput.value = msg.date||''; return; }
      msg.date = parsed; dateInput.value = parsed;
      stamp.textContent = parsed ? formatKoreanDate(parsed) : '';
      save(); renderMsgEditors(room, rid);
    };
    dateInput.onchange = applyDate;
    ed.querySelector('[data-a="dateClear"]').onclick = ()=>{ msg.date=''; save(); renderMsgEditors(room, rid); };

    ed.querySelector('[data-f="text"]').oninput = e=>{ msg.text = e.target.value; save(); };

    const fileInput = ed.querySelector('[data-a="file"]');
    ed.querySelector('[data-a="photo"]').onclick = ()=> fileInput.click();
    fileInput.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      resizeImageFit(f, 720, url=>{ msg.image = url; if(save()) toast('사진이 첨부되었습니다'); renderMsgEditors(room, rid); });
      e.target.value = '';
    };
    const pdel = ed.querySelector('[data-a="photoDel"]');
    if(pdel) pdel.onclick = ()=>{ msg.image=''; save(); renderMsgEditors(room, rid); };

    const uOn = ed.querySelector('[data-f="unreadOn"]');
    const uNum = ed.querySelector('[data-f="unread"]');
    uOn.onchange = e=>{ if(e.target.checked){ msg.unread = Number(msg.unread)||1; uNum.disabled=false; uNum.value=msg.unread; } else { msg.unread=0; uNum.disabled=true; uNum.value=0; } save(); };
    uNum.oninput = e=>{ msg.unread = Math.max(0, Number(e.target.value)||0); save(); };

    ed.querySelector('[data-del]').onclick = ()=>{ room.messages.splice(i,1); save(); renderMsgEditors(room, rid); };
    ed.querySelector('[data-up]').onclick = ()=>{ if(i>0){ [room.messages[i-1],room.messages[i]]=[room.messages[i],room.messages[i-1]]; save(); renderMsgEditors(room, rid);} };
    ed.querySelector('[data-down]').onclick = ()=>{ if(i<room.messages.length-1){ [room.messages[i+1],room.messages[i]]=[room.messages[i],room.messages[i+1]]; save(); renderMsgEditors(room, rid);} };
    box.appendChild(ed);
  });
}

/* ----- 백업/복원 ----- */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
/* 서버 없이(파일을 직접 열었을 때도) 자기 자신의 소스를 만들어 낸다.
   화면에 그려둔 내용은 열 때마다 다시 그리므로 비워서 내보낸다. */
function selfHtml(){
  const root = document.documentElement.cloneNode(true);
  ['#chatList','#messages','#adminBody','#chips','#adbox'].forEach(sel=>{
    const el = root.querySelector(sel); if(el) el.innerHTML = '';
  });
  const off = (sel, cls)=>{ const el = root.querySelector(sel); if(el) el.classList.remove(cls); };
  off('#adminOverlay','active'); off('#roomScreen','active');
  off('#photoViewer','show'); off('#modePill','show'); off('#confirmBox','show'); off('#toast','show');
  const ls = root.querySelector('#listScreen'); if(ls) ls.removeAttribute('style');
  const ab = root.querySelector('#btnAdmin'); if(ab) ab.removeAttribute('style');
  const pi = root.querySelector('#photoViewerImg'); if(pi) pi.removeAttribute('src');
  const ts = root.querySelector('#toast'); if(ts) ts.textContent = '';
  const ml = root.querySelector('#manifestLink'); if(ml) ml.setAttribute('href','./manifest.webmanifest');
  return '<!DOCTYPE html>\n' + root.outerHTML + '\n';
}
/* 지금 내용을 담은 새 index.html 을 만든다 (데이터 구간만 교체) */
function buildHtmlFrom(tpl){
  const i = tpl.indexOf(MARK_S), j = tpl.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  const ver = newVersion();
  const json = JSON.stringify(data, null, 1).replace(/<\//g, '<\\/');
  const block = MARK_S + ' 아래 두 줄이 이 파일에 들어있는 대화 내용입니다. */\n'
    + 'const DATA_VERSION = ' + JSON.stringify(ver) + ';\n'
    + 'const EMBEDDED_DATA = ' + json + ';\n';
  return { html: tpl.slice(0,i) + block + tpl.slice(j), version: ver };
}
function finishExportHtml(built){
  if(!built){ toast('파일을 만들 수 없습니다'); return; }
  downloadFile('index.html', built.html, 'text/html;charset=utf-8');
  baseFp = fingerprint(data);
  save();
  toast('새 index.html 저장됨 · 버전 ' + built.version);
  if($('#adminOverlay').classList.contains('active')) renderAdminHome();
}
function exportHtml(){
  if(location.protocol.indexOf('http') !== 0){
    /* 파일로 직접 열었을 때는 “지금 열려 있는 화면의 코드”가 그대로 저장된다.
       기능이 추가된 파일을 새로 받은 뒤 새로고침 없이 내보내면 예전 코드로 되돌아가므로 한 번 확인한다. */
    confirmDialog(
      '지금 화면에 열려 있는 상태로 파일을 만듭니다.\n기능이 바뀐 파일을 새로 받았다면 먼저 새로고침(F5) 후에 만들어 주세요.',
      ()=> finishExportHtml(buildHtmlFrom(selfHtml())),
      '만들기'
    );
    return;
  }
  fetch('./index.html?_ex=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(tpl=> finishExportHtml(buildHtmlFrom(tpl)))
    .catch(()=> finishExportHtml(buildHtmlFrom(selfHtml())));
}
function exportData(){
  const payload = { app:'단서메신저', version:DATA_VERSION, exportedAt:new Date().toISOString(), data:data };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '단서메신저_백업.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const parsed = JSON.parse(reader.result);
      const body = (parsed && parsed.data) ? parsed.data : parsed;
      if(!body || (!body.lists && !body.rooms)) throw new Error('bad');
      data = normalize(body);
      listIdx = 0;
      if(!baseFp) baseFp = fingerprint(normalize(deepCopy(EMBEDDED_DATA)));
      save();               /* 현재 파일 버전으로 도장을 다시 찍어 저장 */
      toast('불러왔습니다');
      renderAdminHome(true);
    } catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- 이벤트 연결 ---------- */
$('#btnBack').onclick = goBack;
/* 관리자 상태에서만 동작. 손님 모드에서는 장식용(검색 아이콘과 같음) */
$('#btnAdmin').onclick = ()=>{ if(isAdmin) openAdmin(); };
$('#adminClose').onclick = goBack;
$('#adminGuest').onclick = guestMode;
$('#photoClose').onclick = goBack;
$('#photoViewer').onclick = e=>{ if(e.target.id === 'photoViewer') goBack(); };

window.addEventListener('popstate', closeTop);

/* 길게 누를 때 나오는 복사/검색/이미지 저장 메뉴 차단 (입력칸과 관리자 모드는 예외) */
document.addEventListener('contextmenu', e=>{
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if(isAdmin) return;
  e.preventDefault();
});
/* 이미지·글자 드래그 자체를 막는다 */
document.addEventListener('dragstart', e=>{ if(!isAdmin) e.preventDefault(); });

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}
/* 손님 모드에서는 전체화면 기능을 쓰지 않는다 (관리자일 때만 동작) */
$('#btnFull').onclick = ()=>{ if(isAdmin) toggleFullscreen(); };

/* 스크롤 시 오른쪽에 현재 날짜 표시 (카톡 방식) */
let floatDateTimer = null;
function onMessagesScroll(){
  const cont = $('#messages');
  const fd = $('#floatDate');
  if(!cont || !fd) return;
  const fdRect = fd.getBoundingClientRect();
  const refY = fdRect.top + fdRect.height/2;
  const rows = cont.querySelectorAll('.msg-row');
  let curDate = '';
  for(const r of rows){
    const rect = r.getBoundingClientRect();
    if(rect.bottom >= refY){ curDate = r.dataset.date || ''; break; }
  }
  if(!curDate){ fd.classList.remove('show'); return; }
  fd.querySelector('span').textContent = formatKoreanDate(curDate);
  fd.classList.add('show');
  clearTimeout(floatDateTimer);
  floatDateTimer = setTimeout(()=> fd.classList.remove('show'), 1200);
}
$('#messages').addEventListener('scroll', onMessagesScroll, {passive:true});

/* 제목 길게 눌러 관리자 진입 */
let pressTimer = null;
const listTitleEl = $('#listTitle');
function startPress(){ pressTimer = setTimeout(()=>{ openAdmin(); }, 5000); }
function cancelPress(){ clearTimeout(pressTimer); }
listTitleEl.addEventListener('mousedown', startPress);
listTitleEl.addEventListener('touchstart', startPress, {passive:true});
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> listTitleEl.addEventListener(ev, cancelPress));

/* ---------- 시작 ---------- */
/* 주소 끝에 ?reset=1 을 붙여 열면 폰에 저장된 내용과 캐시를 전부 지우고 파일 내용으로 시작한다 */
if(/[?&]reset=1/.test(location.search)){
  try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(LAST_KEY); LEGACY_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{ if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
    }
  }catch(e){}
}
data = load();
selectListFromUrl();
save();
syncUrl();
renderList();

/* 서비스워커: 최신 파일 우선(network-first) + 예전 캐시 자동 삭제 */
if(!('serviceWorker' in navigator)) swState = '이 브라우저는 지원 안 함';
else if(location.protocol.indexOf('http') !== 0) swState = '파일 직접 열기 — 사용 불가';
else {
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    swState = '작동 중';
    applyAppIdentity();
    refreshAdminInfo();
  });
  navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'})
    .then(reg=>{
      swState = '등록됨 (제어 대기)';
      refreshAdminInfo();
      return navigator.serviceWorker.ready;
    })
    .then(()=>{
      swState = navigator.serviceWorker.controller ? '작동 중' : '등록됨 (새로고침하면 작동)';
      applyAppIdentity();
      refreshAdminInfo();
    })
    .catch(e=>{
      swState = '등록 실패: ' + ((e && e.message) ? e.message : String(e));
      refreshAdminInfo();
    });
}

/* 실행할 때마다 서버의 index.html 을 확인해서 새 파일이면 갈아끼운다 */
setTimeout(()=> checkForUpdate(false), 1500);
</script>
